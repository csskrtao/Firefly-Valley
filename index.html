<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0910">
  <meta name="description" content="萤石谷：像素风的种田 + 下矿 RPG。种地、锻造装备、结交镇民，挑战矿脉深处的守层者。">
  <title>萤石谷 Firefly Valley</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&family=Silkscreen&display=swap">
</head>
<body>
  <main id="app">
    <div class="screen" id="screen">
      <div class="stage">
        <canvas id="game" aria-label="游戏画面"></canvas>

        <div class="hud" id="hud" hidden>
          <div class="hud-left">
            <div class="bar hp"><i id="hpBar"></i><span id="hpTxt">HP</span></div>
            <div class="bar en"><i id="enBar"></i><span id="enTxt">体力</span></div>
            <div class="bar xp"><i id="xpBar"></i><span id="xpTxt">Lv.1</span></div>
            <p class="hud-buffs" id="hudBuffs" hidden></p>
            <p class="hud-quest" id="hudQuest" hidden></p>
          </div>
          <div class="hud-right">
            <p id="hudDate"></p>
            <p class="num" id="hudClock"></p>
            <p class="num gold" id="hudGold"></p>
            <p class="where" id="hudWhere"></p>
          </div>
          <div class="hotbar" id="hotbar"></div>
          <div class="skills" id="hudSkills"></div>
          <div class="bossbar" id="bossbar" hidden>
            <b id="bossName"></b>
            <div class="bossbar-track"><i id="bossFill"></i></div>
          </div>
        </div>

        <div class="toast off" id="toast" role="status" aria-live="polite"></div>
      </div>

      <section class="dialog" id="dialog" hidden>
        <canvas id="dlgFace" width="16" height="16"></canvas>
        <div class="dialog-main">
          <b class="dialog-who" id="dlgWho"></b>
          <p class="dialog-text" id="dlgText"></p>
          <div class="dialog-choices" id="dlgChoices" hidden></div>
          <small class="dialog-hint" id="dlgHint"></small>
        </div>
      </section>

      <section class="panel" id="panel" hidden role="dialog" aria-labelledby="panelTitle">
        <header>
          <h2 id="panelTitle"></h2>
          <button type="button" class="panel-close" id="panelClose" aria-label="关闭">×</button>
        </header>
        <nav class="panel-tabs" id="panelTabs"></nav>
        <div class="panel-body" id="panelBody"></div>
        <small class="panel-hint" id="panelHint"></small>
      </section>

      <section class="title" id="title" hidden>
        <div class="title-logo">
          <h1>萤石谷</h1>
          <p>FIREFLY VALLEY</p>
        </div>
        <div class="title-menu" id="titleMenu"></div>
        <p class="title-foot">↑↓ 选择 · E / 回车 确认 · Esc 返回</p>
      </section>

      <div class="fade" id="fade"></div>
    </div>
    <div class="touch" id="touch">
      <div class="stick" id="stick" aria-label="移动"><i></i></div>
      <div class="touch-menu">
        <button type="button" data-press="inventory">背包</button>
        <button type="button" data-press="map">地图</button>
        <button type="button" data-press="pause">菜单</button>
      </div>
      <div class="acts">
        <button type="button" class="sk" data-press="skill" id="tSkill0">技能</button>
        <button type="button" class="sk" data-press="skill2" id="tSkill1">技能</button>
        <button type="button" class="sk" data-press="skill3" id="tSkill2">技能</button>
        <button type="button" data-press="interact">交互</button>
        <button type="button" data-press="tool">工具</button>
        <button type="button" class="big" data-hold="attack">攻击</button>
      </div>
    </div>
  </main>
  <noscript>萤石谷需要开启 JavaScript 才能运行。</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
